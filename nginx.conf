server {
    listen 80;
    listen [::]:80;
    server_name multumofert.pl www.multumofert.pl;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name multumofert.pl www.multumofert.pl;

    # Podmień na realną ścieżkę web roota
    root /var/www/multumofert;
    index index.php;
    charset utf-8;

    # SSL – certyfikat Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/multumofert.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multumofert.pl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → non-www
    if ($host = www.multumofert.pl) {
        return 301 https://multumofert.pl$request_uri;
    }

    # Sitemap
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # robots.txt – serwuj bezpośrednio
    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Wszystkie trasy przez index.php (Router)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        # Dostosuj wersję PHP jeśli inna
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout 30;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Zablokuj dostęp do plików konfiguracyjnych
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location /includes/ {
        deny all;
        return 403;
    }
    location /templates/ {
        deny all;
        return 403;
    }

    # Cache plików statycznych (30 dni)
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Bezpieczeństwo
    add_header X-Frame-Options          "SAMEORIGIN"           always;
    add_header X-Content-Type-Options   "nosniff"              always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"        always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;

    # Logi
    access_log /var/log/nginx/multumofert_access.log;
    error_log  /var/log/nginx/multumofert_error.log;
}
